<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Parent Warm Emerald/Mint Gradient -->
    <linearGradient id="parentBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Glass Top Highlight -->
    <linearGradient id="glassGradP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Parent Bar Gradients (Fresh Mint to Soft Emerald) -->
    <linearGradient id="pBar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="pBar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="pBar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="depthShadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
    <!-- Star Warm Glow -->
    <filter id="starGlowP" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FEF08A" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Apple Squircle Outer Container -->
  <rect width="512" height="512" rx="115" fill="url(#parentBgGrad)"/>
  
  <!-- Subtle Top Curvature Glass Highlight -->
  <rect width="512" height="260" rx="115" fill="url(#glassGradP)"/>
  
  <!-- Precision Rim Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Parent Growth Curve & Handbook Content -->
  <g filter="url(#depthShadowP)">
    <!-- Base Track Line (Handbook Page Base) -->
    <rect x="84" y="414" width="344" height="20" rx="10" fill="#ffffff" fill-opacity="0.32"/>

    <!-- Score Pillars (Student Growth & Subject Mastery) -->
    <rect x="106" y="286" width="70" height="128" rx="22" fill="url(#pBar1Grad)"/>
    <rect x="221" y="204" width="70" height="210" rx="22" fill="url(#pBar2Grad)"/>
    <rect x="336" y="124" width="70" height="290" rx="22" fill="url(#pBar3Grad)"/>

    <!-- Upward Learning Trajectory Curve (孩子的進步曲線) -->
    <path d="M 141 262 Q 242 196, 362 96" fill="none" stroke="#FDE047" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Milestone Nodes (評量得分節點) -->
    <circle cx="141" cy="262" r="16" fill="#F59E0B" stroke="#ffffff" stroke-width="5"/>
    <circle cx="256" cy="180" r="17" fill="#F59E0B" stroke="#ffffff" stroke-width="5"/>
    <circle cx="371" cy="96" r="20" fill="#EA580C" stroke="#ffffff" stroke-width="6"/>

    <!-- Sparkling Achievement Star (家長欣慰的成長之星) -->
    <g transform="translate(372, 68)" filter="url(#starGlowP)">
      <path d="M 40 -18 L 46 4 L 68 10 L 46 16 L 40 38 L 34 16 L 12 10 L 34 4 Z" fill="#FEF08A"/>
    </g>
  </g>
</svg>
