<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Sky to Teal & Emerald) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="48%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glass Top Highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="depthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#012b36" flood-opacity="0.3"/>
    </filter>
    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FEF08A" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Apple Squircle Outer Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Top Curvature Glass Highlight -->
  <rect width="512" height="260" rx="115" fill="url(#glassGrad)"/>
  
  <!-- Precision Rim Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.22"/>

  <!-- Main Chart & Growth Trajectory Group -->
  <g filter="url(#depthShadow)">
    <!-- Base Track Line -->
    <rect x="84" y="408" width="344" height="20" rx="10" fill="#ffffff" fill-opacity="0.3"/>

    <!-- Bar 1 (Left - Foundation / Score Pillar 1) -->
    <rect x="106" y="276" width="70" height="132" rx="22" fill="url(#bar1Grad)"/>
    
    <!-- Bar 2 (Middle - Progress / Score Pillar 2) -->
    <rect x="221" y="194" width="70" height="214" rx="22" fill="url(#bar2Grad)"/>
    
    <!-- Bar 3 (Right - Excellence / Score Pillar 3) -->
    <rect x="336" y="116" width="70" height="292" rx="22" fill="url(#bar3Grad)"/>

    <!-- Dynamic Learning Curve Line -->
    <path d="M 141 254 Q 242 190, 362 96" fill="none" stroke="#FDE047" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Node Milestone Points -->
    <circle cx="141" cy="254" r="16" fill="#F59E0B" stroke="#ffffff" stroke-width="5"/>
    <circle cx="256" cy="174" r="17" fill="#F59E0B" stroke="#ffffff" stroke-width="5"/>
    <circle cx="371" cy="96" r="20" fill="#EA580C" stroke="#ffffff" stroke-width="6"/>

    <!-- Sparkling Achievement Star -->
    <g transform="translate(372, 70)" filter="url(#starGlow)">
      <path d="M 40 -16 L 46 4 L 66 10 L 46 16 L 40 36 L 34 16 L 14 10 L 34 4 Z" fill="#FEF08A"/>
    </g>
  </g>
</svg>
