<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Teacher Blue Gradient (Sky to Royal Indigo) -->
    <linearGradient id="teacherBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Glass Top Highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="tBar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="tBar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="tBar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Cap Gold Gradient -->
    <linearGradient id="capGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="depthShadowT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a192f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Apple Squircle Outer Container -->
  <rect width="512" height="512" rx="115" fill="url(#teacherBgGrad)"/>
  
  <!-- Subtle Top Curvature Glass Highlight -->
  <rect width="512" height="260" rx="115" fill="url(#glassGrad)"/>
  
  <!-- Precision Rim Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Teacher Content Group -->
  <g filter="url(#depthShadowT)">
    <!-- Base Track Line (Teacher Podium/Gradebook base) -->
    <rect x="84" y="414" width="344" height="20" rx="10" fill="#ffffff" fill-opacity="0.32"/>

    <!-- Score Columns (Classroom Analytics) -->
    <rect x="106" y="286" width="70" height="128" rx="22" fill="url(#tBar1Grad)"/>
    <rect x="221" y="220" width="70" height="194" rx="22" fill="url(#tBar2Grad)"/>
    <rect x="336" y="150" width="70" height="264" rx="22" fill="url(#tBar3Grad)"/>

    <!-- Teacher Mortarboard (Educational Management & Professionalism) -->
    <g transform="translate(0, -10)">
      <!-- Cap Skullcap Underneath -->
      <path d="M 198 132 Q 256 166, 314 132 L 314 154 Q 256 188, 198 154 Z" fill="#1E293B" stroke="#ffffff" stroke-width="3"/>
      
      <!-- Cap Diamond Top -->
      <polygon points="256,76 374,118 256,160 138,118" fill="#0F172A" stroke="#FFFFFF" stroke-width="5"/>
      <polygon points="256,82 360,118 256,154 152,118" fill="#1E293B"/>

      <!-- Center Button -->
      <circle cx="256" cy="118" r="9" fill="url(#capGoldGrad)"/>

      <!-- Golden Tassel hanging right -->
      <path d="M 256 118 Q 320 126, 342 165" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
      <!-- Tassel Fringe -->
      <path d="M 338 162 L 350 196 A 6 6 0 0 1 336 198 Z" fill="url(#capGoldGrad)"/>
    </g>

    <!-- Teacher Badge Star on the left pillar -->
    <circle cx="141" cy="286" r="14" fill="#38BDF8" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="220" r="14" fill="#60A5FA" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
